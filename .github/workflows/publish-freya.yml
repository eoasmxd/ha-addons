name: Publish Freya Add-on

on:
  workflow_dispatch:
    inputs:
      publish_edge:
        description: 'Build & Publish Freya (Edge)'
        type: boolean
        default: true
      publish_stable:
        description: 'Build & Publish Freya (Stable)'
        type: boolean
        default: false

jobs:
  publish-freya:
    name: Build & Publish Freya
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform emulation
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Freya (Edge)
        if: inputs.publish_edge == true
        uses: home-assistant/builder@master
        with:
          args: |
            --amd64 \
            --aarch64 \
            --target freya-edge \
            --image "freya-ha-addon-edge-{arch}"

      - name: Build and publish Freya (Stable)
        if: inputs.publish_stable == true
        uses: home-assistant/builder@master
        with:
          args: |
            --amd64 \
            --aarch64 \
            --target freya \
            --image "freya-ha-addon-{arch}"


