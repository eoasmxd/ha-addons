name: "ACME Nano (Let's Encrypt)"
description: "Zero-dependency, auditable Let's Encrypt DNS-01 SSL certificate client / 零依赖、易审计的证书客户端"
url: "https://github.com/eoasmxd/acme-nano"
image: "ghcr.io/eoasmxd/acme-nano-ha-addon-{arch}"
version: "1.0.3"
slug: "acme_nano"
init: false
arch:
  - aarch64
  - amd64
startup: services
boot: auto

map:
  - ssl:rw

options:
  dns_provider: "cloudflare"
  dns_id: ""
  dns_secret: ""
  check_interval: 24
  certificates:
    - enabled: true
      domains: "example.com,*.example.com"
      dns_zone: ""
      certfile: "fullchain.pem"
      keyfile: "privkey.pem"

schema:
  dns_provider: list(cloudflare|aliyun|dnspod|aws|gd|dgon|gcloud|namecheap|azure|ovh|hetznercloud|duckdns|porkbun|namesilo|vultr)
  dns_id: str?
  dns_secret: password
  check_interval: int(1,720)?
  certificates:
    - enabled: bool?
      domains: str
      dns_zone: str
      certfile: str
      keyfile: str

