configuration:
  dns_provider:
    name: DNS Provider
    description: DNS provider used for ACME DNS-01 challenge verification.
  dns_id:
    name: DNS API ID
    description: API ID or Key ID required by your DNS provider (leave empty if not applicable).
  dns_secret:
    name: DNS API Secret
    description: API Secret or Token required by your DNS provider.
  check_interval:
    name: Check Interval (Hours)
    description: Certificate expiration check and renewal interval in hours (default 24, range 1-720).
  certificates:
    name: Certificates
    description: List of certificate configurations to issue and renew (enabled, domains, dns_zone, certfile, keyfile).

