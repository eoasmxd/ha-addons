configuration:
  dns_provider:
    name: DNS 服务商
    description: 用于执行 ACME DNS-01 域名验证的解析服务商
  dns_id:
    name: DNS API ID
    description: 服务商所需的 API ID 或 Key ID（无需填写的厂商留空即可）
  dns_secret:
    name: DNS API 密钥
    description: 对应服务商的 API Secret 或 Token 密钥
  check_interval:
    name: 巡检周期（小时）
    description: 证书到期检查与自动续期周期，单位为小时（范围 1–720）
  certificates:
    name: 证书列表
    description: 需要签发与自动续期的域名证书配置列表
    fields:
      enabled:
        name: 启用
        description: 是否启用该证书签发与续期任务
      domains:
        name: 域名列表
        description: 逗号分隔的域名列表，支持泛域名（例如 example.com,*.example.com）
      dns_zone:
        name: 解析区域（DNS Zone）
        description: 目标域名所在的 DNS 解析区域或主域名
      certfile:
        name: 证书文件路径
        description: 证书链输出文件名或路径，相对路径默认存放于 /ssl/ 目录下
      keyfile:
        name: 私钥文件路径
        description: 证书私钥输出文件名或路径，相对路径默认存放于 /ssl/ 目录下

