configuration:
  server_addr:
    name: Server Address
    description: The public IP address or domain name of your L4Tunnel Server.
  server_port:
    name: Server Port
    description: The control service port of your L4Tunnel Server (default 3007).
  token:
    name: Authentication Token
    description: The authentication token matching the L4Tunnel Server configuration.
  log_level:
    name: Log Level
    description: Logging verbosity level (trace, debug, info, warn, error).
  pool_count:
    name: Connection Pool Size
    description: Number of pre-established tunnel connections in the pool.
  tunnels:
    name: Tunnels
    description: List of TCP port forwarding tunnel rules (name, enabled, local_ip, local_port, remote_port, health_check).

