configuration:
  server_addr:
    name: 服务端地址
    description: L4Tunnel Server 的公网 IP 地址或域名
  server_port:
    name: 服务端端口
    description: L4Tunnel Server 的控制服务端口
  token:
    name: 认证令牌
    description: 连接认证令牌，需与服务端配置保持一致
  log_level:
    name: 日志级别
    description: 运行日志输出级别
  pool_count:
    name: 连接池数量
    description: 预建立的隧道连接池大小
  tunnels:
    name: 隧道列表
    description: TCP 端口映射规则列表。
    fields:
      name:
        name: 隧道名称
        description: 隧道的标识名称（需唯一）
      enabled:
        name: 启用
        description: 是否启用该条隧道规则
      local_ip:
        name: 本地地址
        description: 要穿透的内网目标服务 IP 地址
      local_port:
        name: 本地端口
        description: 要穿透的内网目标服务端口
      remote_port:
        name: 远程端口
        description: 在服务端暴露的公网访问端口
      health_check:
        name: 健康检查
        description: 是否开启对该隧道的连通性健康检查

